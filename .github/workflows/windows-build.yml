# 테스트앱 만들기 — Windows 실행 파일을 GitHub 가 대신 만들어 준다.
#
# 왜 필요한가
#     이 프로젝트를 쓰는 사람(사서교사)의 컴퓨터에 Python 을 설치하게 할 수 없다.
#     학교 컴퓨터는 설치가 막혀 있는 경우도 많다. GitHub 가 빌려주는 Windows
#     컴퓨터에서 exe 를 만들고, 받는 쪽은 zip 을 풀어 더블클릭만 하면 된다.
#
# 받는 법
#     https://github.com/Kehy-xian/ReadingSnail/releases/download/test-build/ReadingSnail-windows.zip
#     링크 하나로 끝난다. **`/releases/latest/` 는 쓰지 않는다** — GitHub 의
#     'latest' 는 시험판(prerelease)을 건너뛰어 404 다. 태그 주소를 직접 쓴다. Actions 의 Artifacts 는 **로그인해야 하고, 실행 중에는
#     회색으로 잠기고, 휴대폰에서는 아예 안 받아진다.** 받는 사람이 그걸 겪게
#     두지 않는다 — 그래서 빌드가 끝나면 Releases 에 같은 zip 을 올린다.
#
# **여기가 이 코드가 Windows 에서 도는 유일한 자리다.** 개발은 Linux 에서 했고,
# -transparentcolor·DPI 인식·폰트 등록·뮤텍스는 Windows 전용이라 여기서만 확인된다.
# 그래서 테스트를 따로 돌리되, 결과와 상관없이 zip 은 만든다 — 시험해 볼 앱이
# 테스트 한 건 때문에 손에 안 들어오면 안 된다.

name: 테스트앱 (Windows)

on:
  workflow_dispatch:          # Actions 탭에서 단추로 실행
  push:
    branches: ['claude/**', main]
    paths-ignore: ['docs/**', '**.md']

permissions:
  contents: read              # 잡별로 필요한 만큼만 연다(빌드 잡은 write)

jobs:
  test:
    name: Windows 에서 테스트
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 의존성
        run: pip install "Pillow>=10.4,<13" "pystray>=0.19,<1" "ttkbootstrap>=1.10"
      - name: 전체 테스트
        run: python -m unittest discover -s tests -v

  build:
    name: 무설치 zip 만들기
    runs-on: windows-latest
    permissions:
      contents: write         # Releases 에 올리려면 필요하다
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성
        # onnxruntime·tokenizers·numpy 는 requirements.txt 에 있지만 여기서는 뺀다.
        # 번들 모델이 없어 어차피 되살리기는 쉬고, 셋이 300MB 를 더한다.
        run: pip install "Pillow>=10.4,<13" "pystray>=0.19,<1" "ttkbootstrap>=1.10" "pyinstaller>=6.15,<7"

      - name: 자리표시 그림 만들기
        # 원화가 아직 없다. 저장소에도 커밋하지 않는다(생성물이므로).
        # 이게 없으면 달팽이가 벡터로 그려진다 — 돌긴 하지만 시험이 덜 된다.
        run: python tools/render_placeholder_pack.py --quiet

      - name: 빌드
        run: pyinstaller ReadingSnail.spec --noconfirm --clean

      - name: 켜지는지 확인
        # **여기가 핵심이다.** 설치본이 아예 안 켜지던 결함(spec 진입점, 빠진
        # schema.sql)은 단위 테스트를 전부 통과하면서도 살아 있었다.
        # 진짜 exe 를 띄워 보고, 기록 파일이 실제로 생기는지까지 본다.
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'snail-smoke'
          $env:READINGSNAIL_DATA_DIR = $data
          $proc = Start-Process -FilePath 'dist\ReadingSnail\ReadingSnail.exe' -PassThru
          Start-Sleep -Seconds 25
          if ($proc.HasExited) {
            throw "앱이 켜지자마자 죽었다 (종료 코드 $($proc.ExitCode))"
          }
          $db = Join-Path $data 'readingsnail.sqlite3'
          if (-not (Test-Path $db)) {
            Stop-Process -Id $proc.Id -Force
            throw "기록 파일이 생기지 않았다: $db"
          }
          Stop-Process -Id $proc.Id -Force
          Write-Host "켜졌고 기록 파일도 생겼다: $db"

      - name: 안내문 넣기
        shell: pwsh
        # 원본 이름은 ASCII 로 둔다 — 한글 파일명이 러너의 인코딩에 걸리면
        # 빌드가 통째로 실패한다. 받는 사람이 보는 이름만 한글이면 된다.
        run: Copy-Item docs\readme_for_testers_ko.txt 'dist\ReadingSnail\읽어보세요.txt'

      - name: 압축
        shell: pwsh
        run: Compress-Archive -Path dist\ReadingSnail\* -DestinationPath ReadingSnail-windows.zip -Force

      - name: Artifacts 에 올리기
        # 켜지는지 확인이 실패해도 올린다 — 무엇이 잘못됐는지 보려면 받아봐야 한다.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 책읽는달팽이-테스트앱-${{ github.sha }}
          path: dist/ReadingSnail
          retention-days: 30
          if-no-files-found: error

      - name: Releases 에 올리기
        # **여기가 실제로 받는 곳이다.** Artifacts 와 달리 로그인도, 데스크톱도
        # 필요 없고 주소가 늘 같다. 늘 같은 태그를 갱신한다 — 시험판이라
        # 버전을 세지 않는다. prerelease 로 표시해 정식 배포와 구분한다.
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'test-build'
          $notes = @"
          자리표시 그림으로 도는 **시험판**입니다. 정식 배포가 아닙니다.

          받는 법: 아래 ``ReadingSnail-windows.zip`` 을 내려받아 압축을 풀고
          ``ReadingSnail.exe`` 를 더블클릭하세요. 설치 과정이 없습니다.
          처음 켤 때 Windows 가 "PC 보호" 창을 띄우면 '추가 정보' → '실행'.

          기록은 ``%LOCALAPPDATA%\ReadingSnail`` 에 따로 쌓입니다.
          앱 폴더를 지우거나 새 zip 으로 바꿔도 기록은 남습니다.

          자세한 것은 zip 안의 ``읽어보세요.txt``.

          커밋: $env:GITHUB_SHA
          "@
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --prerelease --title '책 읽는 달팽이 — 테스트앱' --notes $notes
          } else {
            gh release edit $tag --notes $notes
          }
          gh release upload $tag ReadingSnail-windows.zip --clobber
          # /releases/latest/ 는 prerelease 를 건너뛰어 404 다. 태그 주소를 쓴다.
          Write-Host "받는 곳: https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/ReadingSnail-windows.zip"
